<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <!-- Estilo e Fonte -->
  <style>
    .wordmark {
      font-family: 'Barlow Condensed', 'Archivo Narrow', 'Arial Black', sans-serif;
      font-size: 32px;
      font-weight: 800;
      fill: #1C1F22;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Inter', 'Arial', sans-serif;
      font-size: 8.5px;
      font-weight: 700;
      fill: #C8361D;
      letter-spacing: 2px;
    }
    .stripe-red { fill: #C8361D; }
    .stripe-light { fill: #F4EFE6; }
    .line-dark { stroke: #1C1F22; }
  </style>

  <!-- Símbolo do Toldo -->
  <g transform="translate(10, 10)">
    <!-- Fundo sombra -->
    <path d="M5 45 L55 45 L48 20 L12 20 Z" fill="#E5DFD3" />
    <!-- Listras -->
    <path d="M5 45 L17.5 45 L22.5 20 L12 20 Z" class="stripe-red" />
    <path d="M17.5 45 L30 45 L30 20 L22.5 20 Z" class="stripe-light" />
    <path d="M30 45 L42.5 45 L37.5 20 L30 20 Z" class="stripe-red" />
    <path d="M42.5 45 L55 45 L48 20 L37.5 20 Z" class="stripe-light" />
    <!-- Babado / Onda inferior -->
    <path d="M5 45 C7 48, 9 48, 11 45 C13 48, 15 48, 17 45 C19 48, 21 48, 23 45 C25 48, 27 48, 29 45 C31 48, 33 48, 35 45 C37 48, 39 48, 41 45 C43 48, 45 48, 47 45 C49 48, 51 48, 53 45 C55 48, 57 48, 59 45" stroke="#C8361D" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Haste superior -->
    <path d="M12 20 L48 20" stroke="#1C1F22" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Wordmark -->
  <text x="80" y="42" class="wordmark">Toldos Comerciais</text>
  <text x="81" y="58" class="subtitle">CURITIBA · PROJETO E INSTALAÇÃO</text>
</svg>
