    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />

    <!-- Critical CSS inline para LCP rápido -->
    <style>
      :root {
        --primary: 10 74% 45%;
        --background: 39 24% 93%;
        --foreground: 210 10% 12%;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 16px; scroll-behavior: smooth; }
      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        color: #1C1F22;
        background: #F4EFE6;
        -webkit-font-smoothing: antialiased;
      }
      #root { min-height: 100vh; }
      img { max-width: 100%; height: auto; }
      .startup-fallback { min-height: 100vh; display: grid; place-content: center; gap: 20px; padding: 32px 24px; max-width: 640px; margin: auto; }
      .startup-fallback h1 { font-size: clamp(1.8rem, 7vw, 2.6rem); line-height: 1.2; }
      .startup-fallback a { color: #A42A17; font-weight: 700; text-decoration: underline; }
      .startup-fallback nav { display: flex; flex-wrap: wrap; gap: 20px; }
    </style>


  </head>

  <body>
    <!-- Visible even when the application bundle is delayed or cannot load. -->
    <div id="root">
      <main class="startup-fallback">
        <p>Toldos Comerciais Curitiba</p>
        <h1>Toldos e coberturas para sua empresa</h1>

          <a href="tel:+5541998000366">Ligar: (41) 99800-0366</a>
        </nav>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Do not register the legacy offline cache. /sw.js retires existing installs. -->
  </body>
